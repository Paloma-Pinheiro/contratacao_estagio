<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/x-icon"
        href="https://bkpsitecpsnew.blob.core.windows.net/uploadsitecps/sites/1/2022/07/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/dashboard.css">
    <title>Dashboard</title>
</head>

<body>
    <div id="conteiner">
        <div class="menu">
            <div class="img">
                <!-- <div class="logo"></div> -->
                <img src="/img/logo-cps-2022.svg" alt="" class="logo">
            </div>
            <div class="titulo">
                <h1>Dashboard</h1>
            </div>
            <ul class="cadastros">
                <li><a th:href="@{/}">Início</a></li>
                <li><a th:href="@{/aluno}">Aluno</a></li>
                <li><a th:href="@{/empresa}">Empresa</a></li>
                <li><a th:href="@{/contratos}">Contratos</a></li>
            </ul>
        </div>
        <div class="content">
            <h1>Visão Geral</h1>
            <span class="divisao"></span>

            <p>Resumo dos cadastros de alunos, empresas e contratos de estágio.</p>

            <div class="kpi-container">
                <div class="lote1">
                    <div class="kpi-card">
                        <div class="kpi-titulo"><span>Alunos ativos</span></div>
                        <p th:text="${alunosAtivos}"></p>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-titulo"><span>Contratos ativos</span></div>
                        <p th:text="${contratosAtivos}"></p>
                    </div>
                </div>
                <div class="lote2">
                    <div class="kpi-card">
                        <div class="kpi-titulo"><span>Empresas ativas</span></div>
                        <p th:text="${empresasAtivas}"></p>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-titulo"><span>Contratos próximos do encerramento</span></div>
                        <p th:text="${contratosVencendo}"></p>
                    </div>
                </div>
            </div>

            <hr class="separador">
        </div>
    </div>
</body>

</html>
