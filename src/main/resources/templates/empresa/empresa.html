<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="https://bkpsitecpsnew.blob.core.windows.net/uploadsitecps/sites/1/2022/07/favicon.svg">
    <script src="https://kit.fontawesome.com/df511449c7.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/empresa.css}">
    <title>Empresa</title>
</head>
<body>
    <div id="conteiner">
        <div class="menu">
            <div class="img">
                <img src="/img/logo-cps-2022.svg" alt="" class="logo">
            </div>
            <div class="titulo">
                <h1>Dashboard</h1>
            </div>
            <ul class="cadastros">
                <li><a th:href="@{/}">Início</a></li>
                <li><a th:href="@{/aluno}">Aluno</a></li>
                <li><a th:href="@{/empresa}">Empresa</a></li>
                <li><a th:href="@{/contratos}">Contratos</a></li>
            </ul>
        </div>
        <div class="content">
            <h1>Empresa</h1>
            <span class="divisao"></span>

            <p>Consulte as empresas parceiras cadastradas e suas informações de atuação.</p>

            <div th:if="${sucesso}" class="mensagem sucesso" th:text="${sucesso}"></div>
            <div th:if="${erro}" class="mensagem erro" th:text="${erro}"></div>

            <div class="botao-container">
                <button type="button" class="botao-cadastro" id="abrir">
                    Cadastrar empresa
                </button>
            </div>

            <div class="tabela-container">
                <table class="tabela">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Razão Social</th>
                            <th>Segmento</th>
                            <th>Área de Atuação</th>
                            <th>Ativo</th>
                            <th colspan="3">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="empresa : ${listarEmpresas}">
                            <td th:text="${empresa.id}"></td>
                            <td th:text="${empresa.razaoSocial}"></td>
                            <td th:text="${empresa.segmento}"></td>
                            <td th:text="${empresa.areaAtuacao}"></td>
                            <td th:text="${empresa.ativo} ? 'Sim' : 'Não'"></td>
                            <td>
                                <a class="icon"
                                   th:href="@{/empresa/{id}/editar(id=${empresa.id})}"
                                   title="Editar empresa"
                                   aria-label="Editar empresa">
                                    <i class="fa-solid fa-pen"></i>
                                </a>
                            </td>
                            <td>
                                <form th:action="@{/empresa/{id}/ativar(id=${empresa.id})}" method="post">
                                    <button type="submit" class="icon"
                                            th:title="${empresa.ativo} ? 'Desativar' : 'Ativar'">
                                        <i class="fa-solid"
                                           th:classappend="${empresa.ativo} ? 'fa-pause' : 'fa-play play'"></i>
                                    </button>
                                </form>
                            </td>
                            <td>
                                <form th:action="@{/empresa/{id}/excluir(id=${empresa.id})}"
                                      method="post"
                                      onsubmit="return confirm('Deseja realmente excluir esta empresa?')">
                                    <button type="submit" class="icon" title="Excluir empresa">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listarEmpresas)}">
                            <td colspan="8" class="sem-registros">
                                Nenhuma empresa cadastrada.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <hr class="separador">
        </div>
    </div>
    <div class="overlay" id="overlay"
         th:classappend="${modoEdicao} ? ' modo-edicao' : ''">
        <div class="modal" id="dados">
            <button type="button" class="fechar" id="fechar" aria-label="Fechar">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <form th:action="${formAction}" th:object="${empresaForm}"
                  method="post" id="formEmpresa" novalidate>
                <h2 class="titulo-cadastro"
                    th:text="${modoEdicao} ? 'Editar Empresa' : 'Cadastro da Empresa'">
                    Cadastro da Empresa
                </h2>
                <div class="dados-cadastro">
                    <div class="campo largo">
                        <label for="razaoSocial">Razão Social</label>
                        <input type="text" th:field="*{razaoSocial}"
                               maxlength="150" required>
                    </div>

                    <div class="campo">
                        <label for="segmento">Segmento</label>
                        <input type="text" th:field="*{segmento}"
                               maxlength="100"
                               placeholder="Ex: Tecnologia, Varejo..." required>
                    </div>

                    <div class="campo">
                        <label for="areaAtuacao">Área de Atuação</label>
                        <input type="text" th:field="*{areaAtuacao}"
                               maxlength="100"
                               placeholder="Ex: Desenvolvimento Web..." required>
                    </div>
                </div>
                <div class="area-botao">
                    <button type="submit" class="continuar" id="finalizar"
                            aria-label="Salvar empresa">
                        <i class="fa-solid fa-check"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/empresa.js}" defer></script>
</body>
</html>
